  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ont-display: swap;\n  src: url(\"eed55626-685f-44e7-ae9f-1eff444ebc64\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Geist Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"d016a3f4-63f5-4e5c-9193-b834a1b8546d\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* symbols2 */\n@font-face {\n  font-family: 'Geist Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"e30f5e35-98fe-4f50-af7b-302a8eb0bf13\") format('woff2');\n  unicode-range: U+2000-2001, U+2004-2008, U+200A, U+23B8-23BD, U+2500-259F;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Geist Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"4a194c23-b35c-4536-acca-f6bf99c9847c\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Geist Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"eb2ed20d-31b3-4b65-9621-77b4bd97211c\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Geist Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"3b1aa61e-1b2b-4f4e-9f96-531a02aa96f9\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n:root{\n  --ink:#121417;\n  --ink-soft:#383d42;\n  --muted:#6a7077;\n  --faint:#9aa0a7;\n  --line:#e5e7ea;\n  --line-strong:#cbced3;\n  --paper:#ffffff;\n  --panel:#F3F4F2;        /* light-gray surface */\n  --panel-line:#e3e6e2;\n  --dark:#0e1011;\n  --dark-soft:#1a1d1f;\n  --lime:#e2ffa1;         /* AISAP brand fill — black type on top */\n  --lime-bright:#cdf24a;  /* keylines / marks */\n  --lime-deep:#9fbf3c;\n  --warn:#c23b22;\n  --warn-bg:#fbeeea;\n  --caution:#b07415;\n  --caution-bg:#fbf3e3;\n\n  /* graphic-page palette */\n  --noir:#0a0b0c;\n  --noir-soft:#141618;\n  --grad:linear-gradient(105deg,#DFFD9D 0%,#A3E8F2 100%);\n  --gradV:linear-gradient(168deg,#DFFD9D 0%,#A3E8F2 100%);\n  --grad-diag:linear-gradient(115deg,#DFFD9D 0%,#A3E8F2 100%);\n  --accent:#1c8f96;       /* legible teal for small labels on light bg */\n  --mint:#bdeccf;\n  --cyan:#A3E8F2;\n\n  --sans:'Geist',system-ui,sans-serif;\n  --mono:'Geist Mono',ui-monospace,monospace;\n\n  --pageW:210mm;\n  --pageH:297mm;\n  --mX:19mm;\n  --mTop:18mm;\n  --mBot:15mm;\n}\n\n*{box-sizing:border-box;}\nhtml,body{margin:0;padding:0;}\nbody{\n  background:#d8dade;\n  font-family:var(--sans);\n  color:var(--ink);\n  -webkit-font-smoothing:antialiased;\n  text-rendering:optimizeLegibility;\n}\n\n/* ---------- page shell ---------- */\n.page{\n  position:relative;\n  width:var(--pageW);\n  min-height:var(--pageH);\n  height:var(--pageH);\n  background:var(--paper);\n  margin:14mm auto;\n  padding:var(--mTop) var(--mX) var(--mBot);\n  display:flex;\n  flex-direction:column;\n  overflow:hidden;\n  box-shadow:0 2px 8px rgba(0,0,0,.10),0 18px 50px rgba(0,0,0,.16);\n}\n.page.dark{background:var(--dark);color:#f4f6f3;}\n\n/* running header */\n.rhead{\n  display:flex;justify-content:space-between;align-items:baseline;gap:8mm;\n  font-family:var(--mono);font-size:7.6pt;letter-spacing:.04em;\n  color:var(--muted);text-transform:uppercase;white-space:nowrap;\n  padding-bottom:5mm;margin-bottom:8mm;border-bottom:.6pt solid var(--line);\n}\n.rhead .r{color:var(--faint);}\n.body{flex:1 1 auto;min-height:0;}\n.rfoot{\n  display:flex;justify-content:space-between;align-items:center;gap:8mm;\n  font-family:var(--mono);font-size:7.6pt;letter-spacing:.03em;color:var(--muted);white-space:nowrap;\n  padding-top:4mm;margin-top:8mm;border-top:.6pt solid var(--line);\n}\n.rfoot .wm{font-family:var(--sans);font-weight:600;letter-spacing:-.01em;\n  text-transform:none;font-size:9pt;color:var(--ink);}\n.logo{display:inline-block;width:auto;vertical-align:middle;flex:none;}\n.rfoot .logo,.d-top .logo,.cover .logo,.toolbar .logo{flex:none;}\n.pnum{font-weight:600;color:var(--ink);}\n\n/* ---------- wordmark (typographic placeholder — swap official SVG later) ---------- */\n.wordmark{font-family:var(--sans);font-weight:600;letter-spacing:-.02em;line-height:1;\n  display:inline-flex;align-items:baseline;color:inherit;white-space:nowrap;flex:none;}\n.wordmark .flip{display:inline-block;transform:rotate(180deg);}\n.tm{font-size:.5em;vertical-align:super;font-weight:500;letter-spacing:0;}\n\n/* ---------- typography ---------- */\n.kicker{font-family:var(--mono);font-size:8pt;letter-spacing:.16em;text-transform:uppercase;\n  color:var(--accent);font-weight:600;margin:0 0 7px;}\n.kicker.ink{color:var(--muted);}\nh2.sec{font-family:var(--sans);font-weight:600;font-size:18.5pt;line-height:1.12;\n  letter-spacing:-.015em;margin:0 0 5mm;color:var(--ink);max-width:150mm;}\nh3.sub{font-family:var(--sans);font-weight:600;font-size:12pt;line-height:1.25;\n  letter-spacing:-.005em;margin:7mm 0 2.5mm;color:var(--ink);}\nh4.mini{font-family:var(--mono);font-weight:600;font-size:8.4pt;letter-spacing:.08em;\n  text-transform:uppercase;color:var(--ink-soft);margin:5mm 0 2mm;}\np{font-size:10.6pt;line-height:1.62;color:var(--ink-soft);margin:0 0 3.2mm;\n  max-width:158mm;text-wrap:pretty;}\n.lead{font-size:11.6pt;line-height:1.5;color:var(--ink);font-weight:400;}\nstrong{color:var(--ink);font-weight:600;}\na{color:var(--ink);}\n\n/* bullets */\nul.bul{list-style:none;margin:0 0 3.5mm;padding:0;}\nul.bul li{position:relative;padding-left:6.5mm;font-size:10.6pt;line-height:1.55;\n  color:var(--ink-soft);margin-bottom:1.8mm;max-width:150mm;}\nul.bul li::before{content:\"\";position:absolute;left:1mm;top:2.4mm;width:2.1mm;height:2.1mm;\n  background:var(--grad);}\nul.bul.dash li::before{height:.6mm;top:3.1mm;width:3mm;background:var(--line-strong);}\n.cols2{display:grid;grid-template-columns:1fr 1fr;column-gap:11mm;}\n.cols2 li{break-inside:avoid;max-width:none;}\n\n/* numbered steps */\nol.steps{list-style:none;counter-reset:s;margin:0 0 4mm;padding:0;}\nol.steps>li{position:relative;counter-increment:s;padding-left:9mm;margin-bottom:3mm;\n  font-size:10.6pt;line-height:1.55;color:var(--ink-soft);max-width:150mm;}\nol.steps>li::before{content:counter(s);position:absolute;left:0;top:-0.3mm;\n  width:6mm;height:6mm;border:1pt solid var(--ink);border-radius:50%;\n  font-family:var(--mono);font-size:8pt;font-weight:600;color:var(--ink);\n  display:flex;align-items:center;justify-content:center;}\n\n/* single-step marker */\n.single{position:relative;padding-left:9mm;font-size:10.6pt;color:var(--ink-soft);\n  line-height:1.55;margin-bottom:2.5mm;}\n.single::before{content:\"\";position:absolute;left:0;top:1.6mm;width:5mm;height:5mm;\n  background:var(--ink);clip-path:polygon(0 0,100% 50%,0 100%);}\n\n/* ---------- callouts ---------- */\n.callout{display:grid;grid-template-columns:26mm 1fr;gap:0;margin:4mm 0;\n  border:.8pt solid var(--line);border-left:2.2mm solid transparent;\n  border-image:var(--grad) 1;}\n.callout .lab{font-family:var(--mono);font-size:8pt;font-weight:600;letter-spacing:.06em;\n  text-transform:uppercase;padding:3.2mm 3mm;color:var(--ink);background:var(--panel);\n  border-right:.8pt solid var(--line);}\n.callout .txt{padding:3.2mm 4mm;}\n.callout .txt p{margin:0 0 2mm;font-size:9.8pt;line-height:1.5;}\n.callout .txt p:last-child{margin:0;}\n.callout .txt ul.bul{margin:0;}\n.callout .txt ul.bul li{font-size:9.8pt;margin-bottom:1.2mm;}\n.callout.warn{border-left-color:var(--warn);}\n.callout.warn .lab{color:var(--warn);background:var(--warn-bg);border-right-color:#f1dcd6;}\n.callout.caution{border-left-color:var(--caution);}\n.callout.caution .lab{color:var(--caution);background:var(--caution-bg);border-right-color:#efe2c6;}\n.callout.note .lab{background:var(--grad);color:#10241a;border-right-color:#bfe6cf;}\n\n/* ---------- figure / image placeholder ---------- */\n.figure{margin:4mm 0 2mm;}\n.frame{position:relative;width:100%;border:.8pt solid var(--line-strong);\n  background:\n    repeating-linear-gradient(135deg,transparent 0 10px,rgba(18,20,23,.035) 10px 11px),\n    var(--panel);\n  display:flex;align-items:center;justify-content:center;}\n.frame .ph{font-family:var(--mono);font-size:8.2pt;letter-spacing:.04em;color:var(--muted);\n  text-align:center;text-transform:uppercase;padding:4mm;}\n.frame .ph small{display:block;font-size:7pt;color:var(--faint);margin-top:1.5mm;\n  letter-spacing:.02em;text-transform:none;}\n.marker{position:absolute;width:5.6mm;height:5.6mm;border-radius:50%;background:var(--grad);\n  border:.8pt solid #10241a;color:#10241a;font-family:var(--mono);font-weight:600;font-size:7.6pt;\n  display:flex;align-items:center;justify-content:center;}\n.figcap{font-family:var(--mono);font-size:7.8pt;color:var(--muted);margin-top:2.2mm;\n  letter-spacing:.02em;}\n.figcap b{color:var(--ink);font-weight:600;}\n.legend{display:flex;flex-wrap:wrap;gap:2mm 6mm;margin-top:2.5mm;}\n.legend span{font-size:9.2pt;color:var(--ink-soft);display:flex;gap:2mm;align-items:baseline;}\n.legend span b{font-family:var(--mono);font-size:7.8pt;color:var(--ink);\n  border:.7pt solid var(--line-strong);width:4.6mm;height:4.6mm;display:inline-flex;\n  align-items:center;justify-content:center;flex:none;}\n\n/* ---------- workflow diagram ---------- */\n.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin:4mm 0 2mm;\n  border:.8pt solid var(--line);}\n.flow .node{padding:4mm 3.5mm 4.5mm;border-right:.8pt solid var(--line);position:relative;}\n.flow .node:last-child{border-right:0;}\n.flow .n{font-family:var(--mono);font-weight:600;font-size:8pt;width:6mm;height:6mm;\n  background:var(--grad);color:#10241a;display:flex;align-items:center;justify-content:center;\n  margin-bottom:3mm;}\n.flow .node h5{font-family:var(--sans);font-weight:600;font-size:9.2pt;margin:0 0 1.5mm;\n  letter-spacing:-.01em;color:var(--ink);line-height:1.2;}\n.flow .node p{font-size:8pt;line-height:1.4;margin:0;color:var(--muted);}\n.flow .node .arrow{position:absolute;right:-2.4mm;top:6mm;width:4mm;height:4mm;z-index:2;\n  color:var(--ink);}\n\n/* ---------- feature cards ---------- */\n.cards{display:grid;grid-template-columns:1fr 1fr;gap:5mm;margin:4mm 0 2mm;}\n.card{border:.8pt solid var(--line);padding:5mm;display:flex;flex-direction:column;}\n.card .tag{font-family:var(--mono);font-size:7.6pt;letter-spacing:.1em;text-transform:uppercase;\n  color:var(--accent);font-weight:600;margin-bottom:2.5mm;}\n.card h3{font-family:var(--sans);font-weight:600;font-size:13pt;letter-spacing:-.01em;\n  margin:0 0 2mm;color:var(--ink);}\n.card p{font-size:9.6pt;line-height:1.5;margin:0 0 3mm;}\n.card ul.bul{margin-top:auto;}\n.card ul.bul li{font-size:9pt;margin-bottom:1mm;}\n\n/* ---------- key / spec panel ---------- */\n.panel{background:var(--panel);border:.8pt solid var(--panel-line);padding:5mm 5.5mm;margin:4mm 0;}\n.panel .ph-h{font-family:var(--mono);font-size:8pt;letter-spacing:.1em;text-transform:uppercase;\n  color:var(--muted);margin:0 0 3mm;font-weight:600;}\n.deflist{display:grid;grid-template-columns:34mm 1fr;gap:2mm 5mm;}\n.deflist dt{font-family:var(--mono);font-size:8.4pt;color:var(--ink);font-weight:500;\n  text-transform:uppercase;letter-spacing:.03em;}\n.deflist dd{margin:0;font-size:9.8pt;color:var(--ink-soft);line-height:1.45;}\n\n/* ---------- pull quote ---------- */\n.pull{border-top:1.4pt solid var(--ink);padding-top:4mm;margin:5mm 0;}\n.pull blockquote{margin:0;font-family:var(--sans);font-weight:500;font-size:14pt;line-height:1.32;\n  letter-spacing:-.015em;color:var(--ink);max-width:150mm;}\n.pull .src{font-family:var(--mono);font-size:8pt;letter-spacing:.04em;color:var(--muted);\n  margin-top:3mm;text-transform:uppercase;}\n\n/* ================= COVERS ================= */\n.cover{padding:0;justify-content:stretch;}\n.cover .ctag{position:absolute;top:7mm;left:7mm;z-index:5;white-space:nowrap;\n  font-family:var(--mono);font-size:7.4pt;letter-spacing:.1em;text-transform:uppercase;\n  background:var(--ink);color:#fff;padding:1.6mm 3mm;}\n.cover .ctag.on-dark{background:var(--grad);color:#10241a;}\n\n/* Cover A — editorial minimal */\n.coverA{padding:var(--mTop) var(--mX) var(--mBot);}\n.coverA .top{display:flex;justify-content:space-between;align-items:flex-start;}\n.coverA .meta{font-family:var(--mono);font-size:7.8pt;letter-spacing:.04em;color:var(--muted);\n  text-align:right;line-height:1.7;text-transform:uppercase;white-space:nowrap;}\n.coverA .mid{flex:1;display:flex;flex-direction:column;justify-content:flex-end;}\n.coverA .rule{height:1.4pt;background:var(--ink);margin:0 0 7mm;width:46mm;}\n.coverA .mark{width:9mm;height:9mm;background:var(--grad);display:inline-block;margin-bottom:9mm;}\n.coverA h1{font-family:var(--sans);font-weight:600;font-size:42pt;line-height:1.02;\n  letter-spacing:-.03em;margin:0;color:var(--ink);}\n.coverA h1 em{font-style:normal;color:var(--muted);}\n.coverA .sub{font-size:12.5pt;line-height:1.45;color:var(--ink-soft);max-width:120mm;margin:6mm 0 0;}\n.coverA .foot{display:flex;justify-content:space-between;align-items:flex-end;\n  border-top:.8pt solid var(--line);padding-top:5mm;margin-top:11mm;\n  font-family:var(--mono);font-size:8pt;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;}\n\n/* Cover B — dark hero */\n.coverB{padding:var(--mTop) var(--mX) var(--mBot);background:var(--dark);color:#f4f6f3;}\n.coverB .top{display:flex;justify-content:space-between;align-items:flex-start;color:#f4f6f3;}\n.coverB .meta{font-family:var(--mono);font-size:7.8pt;letter-spacing:.04em;color:#7e858c;\n  text-align:right;line-height:1.7;text-transform:uppercase;white-space:nowrap;}\n.coverB .scan{flex:1;margin:9mm 0;border:.8pt solid #2a2e31;position:relative;\n  background:\n    radial-gradient(120% 80% at 50% 40%,rgba(205,242,74,.10),transparent 60%),\n    repeating-linear-gradient(90deg,transparent 0 7px,rgba(255,255,255,.025) 7px 8px),\n    #131617;\n  display:flex;align-items:center;justify-content:center;}\n.coverB .scan .ph{font-family:var(--mono);font-size:8pt;letter-spacing:.05em;color:#6f767d;\n  text-transform:uppercase;text-align:center;}\n.coverB .scan .ph small{display:block;color:#565c62;font-size:7pt;margin-top:1.5mm;text-transform:none;}\n.coverB h1{font-family:var(--sans);font-weight:600;font-size:38pt;line-height:1.04;\n  letter-spacing:-.03em;margin:0;color:#f7f9f5;}\n.coverB h1 .hl{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}\n.coverB .sub{font-size:12pt;line-height:1.45;color:#aeb4ba;max-width:120mm;margin:5mm 0 0;}\n.coverB .foot{display:flex;justify-content:space-between;align-items:flex-end;\n  border-top:.8pt solid #2a2e31;padding-top:5mm;margin-top:9mm;\n  font-family:var(--mono);font-size:8pt;color:#7e858c;letter-spacing:.03em;text-transform:uppercase;}\n.coverB .wordmark{color:#f7f9f5;}\n\n/* Cover C — technical / spec sheet */\n.coverC{padding:0;}\n.coverC .band{background:var(--grad-diag);padding:var(--mTop) var(--mX) 10mm;}\n.coverC .band .top{display:flex;justify-content:space-between;align-items:flex-start;}\n.coverC .band .doc{font-family:var(--mono);font-size:7.8pt;letter-spacing:.05em;color:#23310a;\n  text-align:right;line-height:1.7;text-transform:uppercase;white-space:nowrap;}\n.coverC h1{font-family:var(--sans);font-weight:600;font-size:40pt;line-height:1.0;\n  letter-spacing:-.03em;margin:24mm 0 0;color:#10160a;max-width:150mm;}\n.coverC .lower{flex:1;padding:9mm var(--mX) var(--mBot);display:flex;flex-direction:column;}\n.coverC .sub{font-size:12.5pt;line-height:1.45;color:var(--ink-soft);max-width:125mm;margin:0 0 8mm;}\n.coverC .specgrid{display:grid;grid-template-columns:repeat(4,1fr);\n  margin-top:auto;gap:0 8mm;}\n.coverC .specgrid div{padding:4mm 0 0;}\n.coverC .specgrid .k{font-family:var(--mono);font-size:7.2pt;letter-spacing:.08em;\n  text-transform:uppercase;color:var(--muted);margin-bottom:1.5mm;}\n.coverC .specgrid .v{font-size:10pt;color:var(--ink);font-weight:500;}\n\n/* ================= CONTENTS ================= */\n.toc-h{font-family:var(--sans);font-weight:600;font-size:30pt;letter-spacing:-.025em;\n  margin:0 0 8mm;color:var(--ink);}\n.toc{margin:0;}\n.toc .row{display:flex;align-items:baseline;gap:3mm;padding:2.6mm 0;border-bottom:.6pt solid var(--line);}\n.toc .row.chap{border-bottom:1pt solid var(--ink);padding-top:5mm;}\n.toc .cn{font-family:var(--mono);font-size:8.4pt;color:var(--accent);font-weight:600;\n  width:9mm;flex:none;}\n.toc .row.chap .cn{color:var(--ink);}\n.toc .ti{font-size:10.6pt;color:var(--ink-soft);}\n.toc .row.chap .ti{font-weight:600;font-size:12pt;color:var(--ink);letter-spacing:-.01em;}\n.toc .row.sub .ti{padding-left:6mm;color:var(--muted);font-size:10pt;}\n.toc .dots{flex:1;border-bottom:.6pt dotted var(--line-strong);transform:translateY(-1mm);}\n.toc .pg{font-family:var(--mono);font-size:8.6pt;color:var(--ink);font-weight:500;flex:none;}\n\n/* ================= CHAPTER DIVIDER ================= */\n.divider{background:var(--dark);color:#f4f6f3;justify-content:space-between;}\n.divider .d-top{display:flex;justify-content:space-between;align-items:baseline;white-space:nowrap;gap:8mm;\n  font-family:var(--mono);font-size:7.8pt;letter-spacing:.06em;text-transform:uppercase;color:#7e858c;}\n.divider .d-mid{display:flex;align-items:flex-end;gap:9mm;}\n.divider .bignum{font-family:var(--sans);font-weight:600;font-size:150pt;line-height:.8;\n  letter-spacing:-.04em;background:var(--gradV);-webkit-background-clip:text;background-clip:text;\n  -webkit-text-fill-color:transparent;color:transparent;}\n.divider .d-title{padding-bottom:8mm;}\n.divider .d-title .kk{font-family:var(--mono);font-size:8pt;letter-spacing:.16em;\n  text-transform:uppercase;color:#7e858c;margin-bottom:3mm;}\n.divider .d-title h2{font-family:var(--sans);font-weight:600;font-size:31pt;letter-spacing:-.02em;\n  margin:0;color:#f7f9f5;}\n.divider .d-foot{font-size:10.4pt;line-height:1.55;color:#aeb4ba;max-width:130mm;\n  border-top:.8pt solid #2a2e31;padding-top:5mm;}\n.divider .wordmark{color:#f7f9f5;}\n\n/* ---------- notices ---------- */\n.notice-grid{display:grid;grid-template-columns:1fr;gap:0;}\n.fine{font-size:8.6pt;line-height:1.5;color:var(--muted);margin:0 0 2.6mm;max-width:165mm;}\n.notice-cols{column-count:2;column-gap:10mm;margin-top:2mm;}\n.notice-cols .blk{break-inside:avoid;margin-bottom:5mm;}\n.notice-cols h4{font-family:var(--mono);font-size:8pt;letter-spacing:.08em;text-transform:uppercase;\n  color:var(--ink);margin:0 0 1.6mm;font-weight:600;}\n\n/* ================= BLACK GRAPHIC / TRANSITION PAGES ================= */\n.optlabel{position:absolute;top:7mm;left:7mm;z-index:6;font-family:var(--mono);font-size:7.2pt;\n  letter-spacing:.1em;text-transform:uppercase;background:#16191c;color:#cfd4d8;border:.6pt solid #2a2e31;\n  padding:1.6mm 3mm;border-radius:1mm;white-space:nowrap;}\n.optlabel.grad{background:var(--grad);color:#0e1a16;border:0;}\n.optlabel.lite{background:#fff;color:#383d42;border:.6pt solid var(--line-strong);}\n.gfx{background:var(--noir);color:#f4f6f3;padding:var(--mTop) var(--mX) var(--mBot);\n  position:relative;overflow:hidden;}\n.gfx .gbody{flex:1 1 auto;min-height:0;position:relative;z-index:2;display:flex;flex-direction:column;}\n.gfx .gfoot{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:flex-end;gap:8mm;\n  white-space:nowrap;font-family:var(--mono);font-size:8pt;letter-spacing:.06em;color:#5f666c;text-transform:uppercase;}\n.gfx .gtop{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:baseline;\n  white-space:nowrap;gap:8mm;margin-bottom:10mm;\n  font-family:var(--mono);font-size:7.8pt;letter-spacing:.06em;color:#5f666c;text-transform:uppercase;}\n\n.gtext{background:var(--grad);-webkit-background-clip:text;background-clip:text;\n  -webkit-text-fill-color:transparent;color:transparent;}\n.gtextV{background:var(--gradV);-webkit-background-clip:text;background-clip:text;\n  -webkit-text-fill-color:transparent;color:transparent;}\n.gkick{font-family:var(--mono);font-size:8pt;letter-spacing:.16em;text-transform:uppercase;\n  color:var(--mint);font-weight:500;margin:0 0 6mm;}\n.gfx h2.gtitle{font-family:var(--sans);font-weight:600;font-size:27pt;line-height:1.08;\n  letter-spacing:-.02em;margin:0 0 5mm;color:#f7f9f5;}\n.gfx p.gp{font-size:11pt;line-height:1.6;color:#aeb4ba;max-width:120mm;margin:0 0 3.5mm;}\n.gfx p.gp b{color:#f4f6f3;font-weight:600;}\n\n/* backgrounds */\n.dotgrid::before{content:\"\";position:absolute;inset:0;z-index:0;\n  background-image:radial-gradient(rgba(255,255,255,.12) .9px,transparent .9px);\n  background-size:8mm 8mm;background-position:center;}\n.linegrid::before{content:\"\";position:absolute;inset:0;z-index:0;\n  background-image:linear-gradient(rgba(255,255,255,.05) .6px,transparent .6px),\n    linear-gradient(90deg,rgba(255,255,255,.05) .6px,transparent .6px);\n  background-size:33.33% 33.33%;}\n.glow-green::after{content:\"\";position:absolute;left:50%;bottom:-10%;transform:translateX(-50%);\n  width:120%;height:75%;z-index:0;pointer-events:none;\n  background:radial-gradient(50% 60% at 50% 60%,rgba(150,210,130,.20),rgba(120,200,180,.06) 55%,transparent 72%);}\n.glow-top::after{content:\"\";position:absolute;left:50%;top:-20%;transform:translateX(-50%);\n  width:90%;height:70%;z-index:0;pointer-events:none;\n  background:radial-gradient(50% 50% at 50% 50%,rgba(130,210,170,.16),transparent 70%);}\n\n/* gradient specialty list (“who it’s for”) */\n.gradlist{margin:0;}\n.gradlist .muted{font-family:var(--sans);font-weight:600;font-size:26pt;line-height:1.12;\n  letter-spacing:-.02em;color:#6a7178;margin:0;}\n.gradlist .items{font-family:var(--sans);font-weight:600;font-size:30pt;line-height:1.12;\n  letter-spacing:-.02em;margin:5mm 0;background:var(--gradV);-webkit-background-clip:text;background-clip:text;\n  -webkit-text-fill-color:transparent;}\n.gradlist .items div{margin:0;}\n.pill{display:inline-flex;align-items:center;font-family:var(--sans);font-weight:500;font-size:11pt;\n  color:#16261c;background:var(--grad);border-radius:50px;padding:3mm 7mm;margin-top:4mm;letter-spacing:-.01em;}\n\n/* orbit lockup */\n.orbit{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;}\n.orbit .ring{position:absolute;border-radius:50%;border:.7pt dashed rgba(255,255,255,.16);}\n.orbit .node{width:15mm;height:15mm;border-radius:50%;background:#0c0e10;\n  border:.8pt solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;\n  box-shadow:0 0 14px 2px rgba(160,230,190,.45),inset 0 0 8px rgba(160,230,190,.25);\n  color:#eef2ee;font-weight:300;font-size:18pt;line-height:1;position:relative;z-index:2;}\n.lockup{position:relative;z-index:3;display:flex;align-items:center;justify-content:center;gap:9mm;}\n\n/* stat cards */\n.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm;margin-top:2mm;}\n.statcard{background:linear-gradient(155deg,#202427 0%,#15181a 60%,#101315 100%);\n  border:.8pt solid #2b2f33;border-radius:5mm;padding:7mm 6mm 6mm;position:relative;overflow:hidden;\n  display:flex;flex-direction:column;min-height:62mm;}\n.statcard .big{font-family:var(--sans);font-weight:700;font-size:42pt;line-height:.92;letter-spacing:-.03em;\n  color:var(--mint);display:flex;align-items:baseline;gap:2mm;}\n.statcard .big .u{font-size:18pt;font-weight:700;color:#f4f6f3;letter-spacing:-.02em;}\n.statcard .cap{font-size:10pt;line-height:1.45;color:#9aa0a7;margin-top:auto;}\n.statcard .cap b{color:#f4f6f3;font-weight:600;}\n.statcard .wmk{position:absolute;right:5mm;bottom:4mm;opacity:.10;}\n\n/* feature checklist (POCUS-OS) */\n.checkhead{display:grid;grid-template-columns:1fr 1fr;gap:8mm;margin:0 0 3mm;}\n.checkhead h4{font-family:var(--sans);font-weight:600;font-size:12.5pt;letter-spacing:-.01em;\n  color:#f4f6f3;margin:0;}\n.checkcols{display:grid;grid-template-columns:1fr 1fr;gap:8mm;}\n.checkcol{display:flex;flex-direction:column;gap:3mm;}\n.crow{display:flex;align-items:center;gap:4mm;background:#161a1d;border:.7pt solid #262b2f;\n  border-radius:2.5mm;padding:3.4mm 4mm;}\n.crow .ck{width:6mm;height:6mm;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;\n  background:var(--grad);}\n.crow .ck svg{width:3.4mm;height:3.4mm;}\n.crow.alt .ck{background:linear-gradient(100deg,#86d2ea,#8fb8ee);}\n.crow span{font-size:10pt;color:#e7eaed;letter-spacing:-.005em;}\n\n/* crosshair use-case grid */\n.ucgrid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:0;z-index:2;margin-top:4mm;}\n.uccell{padding:7mm 7mm 9mm;position:relative;}\n.uccell .uicon{width:8mm;height:8mm;color:var(--mint);margin-bottom:4mm;}\n.uccell .uicon svg{width:100%;height:100%;}\n.uccell h5{font-family:var(--sans);font-weight:600;font-size:11.5pt;line-height:1.2;letter-spacing:-.01em;\n  color:#f4f6f3;margin:0 0 3mm;}\n.uccell p{font-size:9pt;line-height:1.5;color:#878d93;margin:0;max-width:52mm;}\n.uccross{position:absolute;width:3mm;height:3mm;z-index:4;color:var(--cyan);transform:translate(-50%,-50%);}\n.ucline-v{position:absolute;top:0;bottom:0;width:.7pt;background:#23282c;z-index:1;}\n.ucline-h{position:absolute;left:0;right:0;height:.7pt;background:#23282c;z-index:1;}\n\n/* anatomy / leader-line diagrams */\n.diagram{position:relative;z-index:2;flex:1 1 auto;min-height:0;}\n.diagram . 02Fdiv>\n    <\u002Fdiv>\n    <h1>AISAP Platform<br>User Manual<\u002Fh1>\n  <\u002Fdiv>\n  <div class=\"lower\">\n    <p class=\"sub\">Operating instructions for AISAP CARDIO and POCUS-OS™ — capturing studies, AI interpretation, reporting &amp; billing, and integration with PACS and EMR.<\u002Fp>\n    <div class=\"specgrid\">\n      <div><div class=\"k\">Product<\u002Fdiv><div class=\"v\">CARDIO · POCUS-OS™<\u002Fdiv><\u002Fdiv>\n      <div><div class=\"k\">Clearance<\u002Fdiv><div class=\"v\">FDA 510(k)<\u002Fdiv><\u002Fdiv>\n      <div><div class=\"k\">Audience<\u002Fdiv><div class=\"v\">Clinicians<\u002Fdiv><\u002Fdiv>\n      <div><div class=\"k\">Revision<\u002Fdiv><div class=\"v\">A — 2026<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ NOTICES ============ -->\n<section class=\"page\" data-screen-label=\"Notices\">\n  <div class=\"rhead\"><span>Notices &amp; Disclaimers<\u002Fspan><span class=\"r\">AISAP Platform User Manual<\u002Fspan><\u002Fdiv>\n  <div class=\"body\">\n    <p class=\"kicker\">Front matter<\u002Fp>\n    <h2 class=\"sec\">Notices &amp; disclaimers<\u002Fh2>\n    <p class=\"fine\">AISAP, Inc. (“AISAP”) has taken care to ensure the accuracy of this document. However, AISAP assumes no liability for errors or omissions and reserves the right to make changes without further notice to any products herein to improve reliability, function, or design.<\u002Fp>\n    <p class=\"fine\">AISAP product features and benefits depend on system configuration, connected ultrasound hardware, and local regulatory restrictions, and may require enabled licenses, software, or service activation. Performance varies depending on configuration. No product or component can be absolutely secure.<\u002Fp>\n    <p class=\"fine\">The information contained in this document is subject to change without notice. Names and data used in examples are fictitious unless otherwise noted. This document contains proprietary information, which is protected by copyright. No license to any intellectual property rights is granted by this document.<\u002Fp>\n\n    <div class=\"notice-cols\">\n      <div class=\"blk\">\n        <h4>Proprietary information<\u002Fh4>\n        <p class=\"fine\">This document contains proprietary information, which is protected by copyright. Unauthorized copying, in addition to infringing copyright, may reduce the ability of AISAP to provide accurate and current information to users.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"blk\">\n        <h4>Trademarks<\u002Fh4>\n        <p class=\"fine\">AISAP®, the AISAP logo, AISAP CARDIO®, POCAD™, and POCUS-OS™ are trademarks of AISAP, Inc. Other names and brands may be claimed as the property of others. AISAP is not affiliated with or endorsed by any ultrasound hardware manufacturer referenced herein.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"blk\">\n        <h4>Manufacturer<\u002Fh4>\n        <p class=\"fine\">AISAP, Inc.<br>Contact: aisap@aisap.ai<br>Website: www.aisap.ai<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"blk\">\n        <h4>Caution<\u002Fh4>\n        <p class=\"fine\">U.S. federal law restricts this device to use by or on the order of a physician. AISAP provides clinical decision support only; the clinician retains ultimate responsibility for diagnosis.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"fine\" style=\"margin-top:4mm;\">Copyright © 2026 AISAP, Inc. All rights reserved. No part of this document may be reproduced, modified, distributed, or otherwise used without prior written permission.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"rfoot\"><img class=\"logo\" src=\"0602925d-0724-4e65-9f87-e9e8b9461874\" alt=\"aisap\" style=\"height:4mm;\"><span>AISAP-UM-001 · REV A<\u002Fspan><span class=\"pnum\">2<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ CONTENTS ============ -->\n<section class=\"page\" data-screen-label=\"Contents\">\n  <div class=\"rhead\"><span>Contents<\u002Fspan><span class=\"r\">AISAP Platform User Manual<\u002Fspan><\u002Fdiv>\n  <div class=\"body\">\n    <h2 class=\"toc-h\">Contents<\u002Fh2>\n    <div class=\"toc\">\n      <div class=\"row chap\"><span class=\"cn\">01<\u002Fspan><span class=\"ti\">Introduction<\u002Fspan><span class=\"dots\"><\u002Fspan><span class=\"pg\">7<\u002Fspan><\u002Fdiv>\n      <div class=\"row sub\"><span class=\"cn\"><\u002Fspan><span class=\"ti\">About this manual<\u002Fspan><span class=\"dots\"><\u002Fspan><span class=\"pg\">7<\u002Fspan><\u002Fdiv>\n      <div class=\"row sub\"><span class=\"cn\"><\u002Fspan><span class=\"ti\">Document conventions<\u002Fspan><span class=\"dots\"><\u002Fspan><span class=\"pg\">8<\u002Fspan><\u002Fdiv>\n      <div class=\"row sub\"><span class=\"cn\"><\u002Fspan><span class=\"ti\">How the AISAP platform works<\u002Fspan><span class=\"dots\"><\u002Fspan><span class=\"pg\">9<\u002Fspan><\u002Fdiv>\n      <div class=\"row sub\"><span class=\"cn\"><\u002Fspan><span class=\"ti\">What’s included<\u002Fspan><span class=\"dots\"><\u002Fspan><span class=\"pg\">10<\u002Fspan><\u002Fdiv>\n      <div class=\"row sub\"><span class=\"cn\"><\u002Fspan><span class=\"ti\">Intended use<\u002Fspan><span class=\"dots\"><\u002Fspan><span class=\"pg\">11<\u002Fspan><\u002Fdiv>\n      <div class=\"row sub\"><span class=\"cn\"><\u002Fspan><span class=\"ti\">Indications &amp; contraindications<\u002Fspan><span class=\"dots\"><\u002Fspan><span class=\"pg\">12<\u002Fspan><\u002Fdiv>\n      <div class=\"row sub\"><span class=\"cn\"><\u002Fspan><span class=\"ti\">Intended users &amp; getting help<\u002Fspan><span class=\"dots\"><\u002Fspan><span class=\"pg\">13<\u002Fspan><\u002Fdiv>\n\n      <div class=\"row chap\"><span class=\"cn\">02<\u002Fspan><span class=\"ti\">Getting Started<\u002Fspan><span class=\"dots\"><\u002Fspan><span class=\"pg\">14<\u002Fspan><\u002Fdiv>\n      <div class=\"row chap\"><span class=\"cn\">03<\u002Fspan><span class=\"ti\">Capturing &amp; Importing Studies<\u002Fspan><span class=\"dots\"><\u002Fspan><span class=\"pg\">22<\u002Fspan><\u002Fdiv>\n      <div class=\"row chap\"><span class=\"cn\">04<\u002Fspan><span class=\"ti\">AI Results &amp; Measurements<\u002Fspan><span class=\"dots\"><\u002Fspan><span class=\"pg\">30<\u002Fspan><\u002Fdiv>\n      <div class=\"row chap\"><span class=\"cn\">05<\u002Fspan><span class=\"ti\">Reporting &amp; Billing<\u002Fspan><span class=\"dots\"><\u002Fspan><span class=\"pg\">40<\u002Fspan><\u002Fdiv>\n      <div class=\"row chap\"><span class=\"cn\">06<\u002Fspan><span class=\"ti\">PACS, EMR &amp; Integrations<\u002Fspan><span class=\"dots\"><\u002Fspan><span class=\"pg\">48<\u002Fspan><\u002Fdiv>\n      <div class=\"row chap\"><span class=\"cn\">07<\u002Fspan><span class=\"ti\">Administration<\u002Fspan><span class=\"dots\"><\u002Fspan><span class=\"pg\">54<\u002Fspan><\u002Fdiv>\n      <div class=\"row chap\"><span class=\"cn\">08<\u002Fspan><span class=\"ti\">Settings &amp; Preferences<\u002Fspan><span class=\"dots\"><\u002Fspan><span class=\"pg\">60<\u002Fspan><\u002Fdiv>\n      <div class=\"row chap\"><span class=\"cn\">09<\u002Fspan><span class=\"ti\">Security, Privacy &amp; Compliance<\u002Fspan><span class=\"dots\"><\u002Fspan><span class=\"pg\">66<\u002Fspan><\u002Fdiv>\n      <div class=\"row chap\"><span class=\"cn\">10<\u002Fspan><span class=\"ti\">Troubleshooting &amp; Support<\u002Fspan><span class=\"dots\"><\u002Fspan><span class=\"pg\">72<\u002Fspan><\u002Fdiv>\n      <div class=\"row chap\"><span class=\"cn\">—<\u002Fspan><span class=\"ti\">Glossary<\u002Fspan><span class=\"dots\"><\u002Fspan><span class=\"pg\">78<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"rfoot\"><img class=\"logo\" src=\"0602925d-0724-4e65-9f87-e9e8b9461874\" alt=\"aisap\" style=\"height:4mm;\"><span>AISAP-UM-001 · REV A<\u002Fspan><span class=\"pnum\">3<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ CHAPTER 1 DIVIDER ============ -->\n<section class=\"page divider\" data-screen-label=\"Chapter 1 divider\">\n  <div class=\"d-top\"><img class=\"logo\" src=\"a54e2bba-1568-4ea4-9a8e-bd876e9b1b99\" alt=\"aisap\" style=\"height:6mm;\"><span>AISAP Platform User Manual<\u002Fspan><\u002Fdiv>\n  <div class=\"d-mid\">\n    <div class=\"bignum\">01<\u002Fdiv>\n    <div class=\"d-title\">\n      <div class=\"kk\">Chapter 01<\u002Fdiv>\n      <h2>Introduction<\u002Fh2>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"d-foot\">This chapter introduces the AISAP platform, the conventions used throughout this manual, what is included with CARDIO and POCUS-OS™, intended use and indications, and how to get help.<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 1 — ABOUT + CONVENTIONS ============ -->\n<section class=\"page\" data-screen-label=\"1.1 About\">\n  <div class=\"rhead\"><span>Chapter 1 · Introduction<\u002Fspan><span class=\"r\">AISAP Platform User Manual<\u002Fspan><\u002Fdiv>\n  <div class=\"body\">\n    <p class=\"kicker\">1.1<\u002Fp>\n    <h2 class=\"sec\">About this manual<\u002Fh2>\n    <p class=\"lead\">This user manual describes how to use the AISAP platform — AISAP CARDIO and POCUS-OS™ — to acquire, interpret, report, and securely manage point-of-care ultrasound (POCUS) studies.<\u002Fp>\n    <p>It is intended to assist trained healthcare professionals in the safe and effective use of the platform. Review and understand all instructions before clinical use, paying careful attention to the warnings and cautions throughout this manual. AISAP provides clinical decision support only — the interpreting clinician retains ultimate responsibility for diagnosis.<\u002Fp>\n\n    <h3 class=\"sub\" style=\"margin-top:8mm;\">Document conventions<\u002Fh3>\n    <p>This manual uses the following conventions. The three advisory styles below appear throughout — review them before continuing.<\u002Fp>\n\n    <div class=\"callout warn\">\n      <div class=\"lab\">Warning<\u002Fdiv>\n      <div class=\"txt\"><p>A <strong>warning<\u002Fstrong> describes precautions necessary to prevent patient harm, misdiagnosis, or loss of life — for example, relying on AI output as a sole basis for diagnosis.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"callout caution\">\n      <div class=\"lab\">Caution<\u002Fdiv>\n      <div class=\"txt\"><p>A <strong>caution<\u002Fstrong> describes precautions necessary to protect data integrity, system function, or workflow continuity.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"callout note\">\n      <div class=\"lab\">Note<\u002Fdiv>\n      <div class=\"txt\"><p>A <strong>note<\u002Fstrong> provides supplemental information, tips, or context that helps you use the platform more effectively.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <ul class=\"bul\" style=\"margin-top:5mm;\">\n      <li>Numbered steps must be performed in the order shown.<\u002Fli>\n      <li>Bulleted lists present information that does not imply a sequence.<\u002Fli>\n      <li>Single-step procedures begin with a <strong>▶<\u002Fstrong> marker.<\u002Fli>\n      <li>Interface elements you tap or click are shown in <strong>bold<\u002Fstrong>.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n  <div class=\"rfoot\"><img class=\"logo\" src=\"0602925d-0724-4e65-9f87-e9e8b9461874\" alt=\"aisap\" style=\"height:4mm;\"><span>AISAP-UM-001 · REV A<\u002Fspan><span class=\"pnum\">7<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 2 — HOW THE PLATFORM WORKS ============ -->\n<section class=\"page\" data-screen-label=\"1.3 How it works\">\n  <div class=\"rhead\"><span>Chapter 1 · Introduction<\u002Fspan><span class=\"r\">AISAP Platform User Manual<\u002Fspan><\u002Fdiv>\n  <div class=\"body\">\n    <p class=\"kicker\">1.2<\u002Fp>\n    <h2 class=\"sec\">How the AISAP platform works<\u002Fh2>\n    <p>AISAP is an AI operating system for point-of-care ultrasound. It connects to the ultrasound devices you already use, anonymizes and stores studies in a dedicated cloud PACS, runs FDA-cleared AI models to produce bedside results, and generates billable reports that flow back into your EMR. The end-to-end workflow is shown below.<\u002Fp>\n\n    <div class=\"flow\">\n      <div class=\"node\"><div class=\"n\">1<\u002Fdiv><h5>POCUS Integration<\u002Fh5><p>Connect any compatible point-of-care ultrasound device already in use.<\u002Fp><\u002Fdiv>\n      <div class=\"node\"><div class=\"n\">2<\u002Fdiv><h5>PACS on Cloud<\u002Fh5><p>Studies are anonymized and stored securely in the cloud or on-premise.<\u002Fp><\u002Fdiv>\n      <div class=\"node\"><div class=\"n\">3<\u002Fdiv><h5>AI Results<\u002Fh5><p>FDA-cleared models deliver bedside diagnoses and measurements.<\u002Fp><\u002Fdiv>\n      <div class=\"node\"><div class=\"n\">4<\u002Fdiv><h5>Reporting<\u002Fh5><p>Billable reports are generated automatically for clinician approval.<\u002Fp><\u002Fdiv>\n      <div class=\"node\"><div class=\"n\">5<\u002Fdiv><h5>EMR Integration<\u002Fh5><p>Finalized reports are sent back to the EMR automatically.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"figcap\"><b>Figure 1.1<\u002Fb> — The POCUS-OS™ workflow, from acquisition to documented, billable encounter.<\u002Fdiv>\n\n    <div class=\"figure\">\n      <div class=\"frame\" style=\"height:62mm;\">\n        <span class=\"marker\" style=\"top:8mm;left:10mm;\">A<\u002Fspan>\n        <span class=\"marker\" style=\"top:8mm;right:10mm;\">B<\u002Fspan>\n        <span class=\"marker\" style=\"bottom:8mm;left:30mm;\">C<\u002Fspan>\n        <div class=\"ph\">App screenshot — AISAP CARDIO results view<small>drop UI capture: 2D clip · AI overlay · measurement panel<\u002Fsmall><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"legend\">\n        <span><b>A<\u002Fb> Cine clip with AI overlay<\u002Fspan>\n        <span><b>B<\u002Fb> Detected pathologies &amp; urgency<\u002Fspan>\n        <span><b>C<\u002Fb> Quantitative measurements<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"rfoot\"><img class=\"logo\" src=\"0602925d-0724-4e65-9f87-e9e8b9461874\" alt=\"aisap\" style=\"height:4mm;\"><span>AISAP-UM-001 · REV A<\u002Fspan><span class=\"pnum\">9<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 3 — WHAT'S INCLUDED ============ -->\n<section class=\"page\" data-screen-label=\"1.4 What's included\">\n  <div class=\"rhead\"><span>Chapter 1 · Introduction<\u002Fspan><span class=\"r\">AISAP Platform User Manual<\u002Fspan><\u002Fdiv>\n  <div class=\"body\">\n    <p class=\"kicker\">1.3<\u002Fp>\n    <h2 class=\"sec\">What’s included<\u002Fh2>\n    <p>The AISAP platform combines a diagnostic AI application with a point-of-care operating system. Your subscription may include one or both of the following, depending on your license.<\u002Fp>\n\n    <div class=\"cards\">\n      <div class=\"card\">\n        <div class=\"tag\">Diagnostic AI<\u002Fdiv>\n        <h3>AISAP CARDIO<\u002Fh3>\n        <p>FDA-cleared computer-assisted diagnosis (CADx) for cardiac POCUS. Empowers clinicians with basic scanning skills to assess most common cardiac structural and functional parameters at the bedside, within minutes.<\u002Fp>\n        <ul class=\"bul\">\n          <li>Valvular pathology modules<\u002Fli>\n          <li>LVEF, RV/LV dimensions, RV FAC<\u002Fli>\n          <li>Atrial areas, ascending aorta, IVC<\u002Fli>\n          <li>Per-finding urgency indication<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <div class=\"tag\">Platform<\u002Fdiv>\n        <h3>POCUS-OS™<\u002Fh3>\n        <p>An all-in-one operating system for point-of-care ultrasound — bridging bedside devices and hospital systems through a secure on-premise-to-cloud architecture.<\u002Fp>\n        <ul class=\"bul\">\n          <li>Device-agnostic acquisition<\u002Fli>\n          <li>Dedicated cloud PACS<\u002Fli>\n          <li>Automated, billable reporting<\u002Fli>\n          <li>PACS, EMR &amp; QA integration<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h4 class=\"mini\">You will also need<\u002Fh4>\n    <ul class=\"bul dash cols2\">\n      <li>A compatible, in-use POCUS ultrasound device<\u002Fli>\n      <li>An AISAP user account with an assigned license<\u002Fli>\n      <li>A supported mobile device or workstation<\u002Fli>\n      <li>Network connectivity for sign-in, upload &amp; sync<\u002Fli>\n    <\u002Ful>\n\n    <div class=\"callout note\">\n      <div class=\"lab\">Note<\u002Fdiv>\n      <div class=\"txt\"><p>AISAP is vendor-agnostic and integrates with most point-of-care ultrasound devices, PACS, and EMR systems already in use. Contact your administrator to confirm the devices and integrations enabled for your facility.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"rfoot\"><img class=\"logo\" src=\"0602925d-0724-4e65-9f87-e9e8b9461874\" alt=\"aisap\" style=\"height:4mm;\"><span>AISAP-UM-001 · REV A<\u002Fspan><span class=\"pnum\">10<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 4 — INTENDED USE ============ -->\n<section class=\"page\" data-screen-label=\"1.5 Intended use\">\n  <div class=\"rhead\"><span>Chapter 1 · Introduction<\u002Fspan><span class=\"r\">AISAP Platform User Manual<\u002Fspan><\u002Fdiv>\n  <div class=\"body\">\n    <p class=\"kicker\">1.4<\u002Fp>\n    <h2 class=\"sec\">Intended use<\u002Fh2>\n    <p>AISAP CARDIO is cloud-based software intended to assist trained clinicians in the assessment of cardiac structure and function from previously acquired 2D echocardiographic images, providing computer-assisted detection and quantitative measurements as an adjunct to clinical evaluation. POCUS-OS™ is intended to support the electronic transfer, documentation, storage, and display of medical ultrasound images and reports.<\u002Fp>\n\n    <div class=\"panel\">\n      <div class=\"ph-h\">Use summary<\u002Fdiv>\n      <dl class=\"deflist\">\n        <dt>Intended users<\u002Fdt>\n        <dd>Healthcare professionals trained and qualified in the acquisition and interpretation of ultrasound images — including physicians, sonographers, and nurses.<\u002Fdd>\n        <dt>AI tools<\u002Fdt>\n        <dd>Clinicians trained and qualified to conduct echocardiography in the current standard of care while acquiring images.<\u002Fdd>\n        <dt>Patient population<\u002Fdt>\n        <dd>CARDIO: patients 18 years of age and older.<\u002Fdd>\n        <dt>Use environment<\u002Fdt>\n        <dd>Settings where care is provided by trained professionals — hospitals, clinics, urgent care, screening programs, and primary care.<\u002Fdd>\n      <\u002Fdl>\n    <\u002Fdiv>\n\n    <div class=\"callout warn\">\n      <div class=\"lab\">Warning<\u002Fdiv>\n      <div class=\"txt\"><p>AISAP output is intended as an adjunct to, and not a replacement for, clinical judgment and formal diagnostic study. Do not use AISAP results as the sole basis for diagnosis or treatment. When using AI, the clinician retains ultimate responsibility for the diagnosis based on their standard procedures.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"callout caution\">\n      <div class=\"lab\">Caution<\u002Fdiv>\n      <div class=\"txt\"><p>AISAP is intended for use by trained and qualified healthcare professionals capable of interpreting image quality, diagnosis, and the clinical utility of the system. For optimal performance, keep the application updated to the latest available version.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"rfoot\"><img class=\"logo\" src=\"0602925d-0724-4e65-9f87-e9e8b9461874\" alt=\"aisap\" style=\"height:4mm;\"><span>AISAP-UM-001 · REV A<\u002Fspan><span class=\"pnum\">11<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 5 — INDICATIONS / CONTRAINDICATIONS ============ -->\n<section class=\"page\" data-screen-label=\"1.6 Indications\">\n  <div class=\"rhead\"><span>Chapter 1 · Introduction<\u002Fspan><span class=\"r\">AISAP Platform User Manual<\u002Fspan><\u002Fdiv>\n  <div class=\"body\">\n    <p class=\"kicker\">1.5<\u002Fp>\n    <h2 class=\"sec\">Indications &amp; contraindications<\u002Fh2>\n    <h3 class=\"sub\" style=\"margin-top:0;\">Indications for use<\u002Fh3>\n    <p>AISAP CARDIO is indicated to assist trained clinicians in evaluating the following cardiac structural and functional parameters from point-of-care echocardiographic images:<\u002Fp>\n    <ul class=\"bul cols2\">\n      <li>Left ventricular ejection fraction (LVEF)<\u002Fli>\n      <li>Valvular pathology assessment<\u002Fli>\n      <li>Right &amp; left ventricular dimensions<\u002Fli>\n      <li>RV fractional area change (RV FAC)<\u002Fli>\n      <li>Right &amp; left atrial areas<\u002Fli>\n      <li>Ascending aorta diameter<\u002Fli>\n      <li>Inferior vena cava (IVC) diameter<\u002Fli>\n      <li>Pericardial effusion assessment<\u002Fli>\n    <\u002Ful>\n\n    <h3 class=\"sub\">Contraindications<\u002Fh3>\n    <ul class=\"bul\">\n      <li>AISAP must not be used for indications other than those cleared by the applicable governing agency.<\u002Fli>\n      <li>Not intended as a sole basis for diagnosis, or as a replacement for formal echocardiographic study.<\u002Fli>\n      <li>CARDIO is not intended for patients under 18 years of age.<\u002Fli>\n      <li>Not intended for internal use or for image acquisition through unintended anatomy.<\u002Fli>\n    <\u002Ful>\n\n    <div class=\"callout note\">\n      <div class=\"lab\">Note<\u002Fdiv>\n      <div class=\"txt\"><p>Available AI modules and measurements depend on your license and region. Some capabilities described in this manual may not be enabled for your facility.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"rfoot\"><img class=\"logo\" src=\"0602925d-0724-4e65-9f87-e9e8b9461874\" alt=\"aisap\" style=\"height:4mm;\"><span>AISAP-UM-001 · REV A<\u002Fspan><span class=\"pnum\">12<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 6 — INTENDED USERS / GETTING HELP ============ -->\n<section class=\"page\" data-screen-label=\"1.8 Getting help\">\n  <div class=\"rhead\"><span>Chapter 1 · Introduction<\u002Fspan><span class=\"r\">AISAP Platform User Manual<\u002Fspan><\u002Fdiv>\n  <div class=\"body\">\n    <p class=\"kicker\">1.6<\u002Fp>\n    <h2 class=\"sec\">Intended users &amp; getting help<\u002Fh2>\n    <p>AISAP is designed so that any qualified caregiver with basic scanning skills can acquire studies confidently after short training, while expert-level interpretation is delivered by the AI and confirmed by the clinician.<\u002Fp>\n\n    <h4 class=\"mini\">Roles<\u002Fh4>\n    <ul class=\"bul\">\n      <li><strong>Clinician<\u002Fstrong> — acquires studies, reviews AI results, approves and signs reports.<\u002Fli>\n      <li><strong>Facility administrator<\u002Fstrong> — manages users, devices, licenses, and integrations.<\u002Fli>\n      <li><strong>Quality reviewer<\u002Fstrong> — oversees accreditation and QA across the facility.<\u002Fli>\n    <\u002Ful>\n\n    <div class=\"pull\">\n      <blockquote>“Our ‘anywhere, anytime AI’ approach brings cutting-edge diagnostic tools to the point of care — from the largest academic centers to the most remote rural locations.”<\u002Fblockquote>\n      <div class=\"src\">AISAP — on the mission of point-of-care assisted diagnosis<\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"sub\">Getting help<\u002Fh3>\n    <p>In addition to the information in this manual, you can reach AISAP support for setup, training, and troubleshooting.<\u002Fp>\n    <div class=\"panel\">\n      <dl class=\"deflist\">\n        <dt>Email<\u002Fdt><dd>aisap@aisap.ai<\u002Fdd>\n        <dt>Website<\u002Fdt><dd>www.aisap.ai<\u002Fdd>\n        <dt>In-app<\u002Fdt><dd>Profile → Support → Contact AISAP / User manual<\u002Fdd>\n      <\u002Fdl>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"rfoot\"><img class=\"logo\" src=\"0602925d-0724-4e65-9f87-e9e8b9461874\" alt=\"aisap\" style=\"height:4mm;\"><span>AISAP-UM-001 · REV A<\u002Fspan><span class=\"pnum\">13<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n\n<!-- ##################### CONCEPT EXPLORATIONS ##################### -->\n\n<!-- ===== COVER CONCEPT D — ORBIT LOCKUP ===== -->\n<section class=\"page gfx dotgrid glow-top cover\" data-screen-label=\"Cover D\">\n  <span class=\"optlabel grad\">Cover D · Orbit lockup<\u002Fspan>\n  <div class=\"orbit\">\n    <div class=\"ring\" style=\"width:58mm;height:58mm;\"><\u002Fdiv>\n    <div class=\"ring\" style=\"width:92mm;height:92mm;\"><\u002Fdiv>\n    <div class=\"ring\" style=\"width:128mm;height:128mm;\"><\u002Fdiv>\n    <div class=\"ring\" style=\"width:166mm;height:166mm;\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"gtop\"><span>AISAP Platform<\u002Fspan><span>AISAP-UM-001 · Rev A<\u002Fspan><\u002Fdiv>\n  <div class=\"gbody\" style=\"justify-content:center;align-items:center;text-align:center;\">\n    <div class=\"lockup\">\n      <img class=\"logo\" src=\"a54e2bba-1568-4ea4-9a8e-bd876e9b1b99\" alt=\"aisap\" style=\"height:12mm;\">\n      <div class=\"node\">+<\u002Fdiv>\n      <span style=\"font-family:var(--sans);font-weight:600;font-size:16pt;color:#f4f6f3;letter-spacing:-.01em;white-space:nowrap;\">POCUS-OS™<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"margin-top:24mm;font-family:var(--sans);font-weight:600;font-size:21pt;color:#f4f6f3;letter-spacing:-.02em;white-space:nowrap;\">Platform User Manual<\u002Fdiv>\n    <div style=\"margin-top:3.5mm;font-family:var(--mono);font-size:7.6pt;letter-spacing:.12em;text-transform:uppercase;color:#7e858c;white-space:nowrap;\">Operating guide · CARDIO &amp; POCUS-OS™<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"gfoot\"><span>FDA-cleared diagnostic AI<\u002Fspan><span>aisap.ai<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== COVER CONCEPT E — GRADIENT FULL-BLEED ===== -->\n<section class=\"page cover coverE\" data-screen-label=\"Cover E\">\n  <span class=\"optlabel lite\">Cover E · Gradient<\u002Fspan>\n  <div class=\"top\">\n    <img class=\"l spacing:.16em;text-transform:uppercase;margin-bottom:3mm;\">Chapter 02<\u002Fdiv><h2>Getting Started<\u002Fh2><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"d-foot\" style=\"font-size:10.4pt;line-height:1.55;max-width:130mm;padding-top:5mm;color:var(--muted);\">Set up your account, connect a compatible POCUS device, and learn your way around the AISAP workspace.<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== CHAPTER CONCEPT C — DARK ORBIT NODE ===== -->\n<section class=\"page gfx dotgrid\" data-screen-label=\"Chapter concept C\">\n  <span class=\"optlabel\">Chapter C · Orbit<\u002Fspan>\n  <div class=\"orbit\" style=\"justify-content:center;\">\n    <div class=\"ring\" style=\"width:70mm;height:70mm;\"><\u002Fdiv>\n    <div class=\"ring\" style=\"width:110mm;height:110mm;\"><\u002Fdiv>\n    <div class=\"ring\" style=\"width:150mm;height:150mm;\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"gtop\"><img class=\"logo\" src=\"a54e2bba-1568-4ea4-9a8e-bd876e9b1b99\" alt=\"aisap\" style=\"height:6mm;\"><span>AISAP Platform User Manual<\u002Fspan><\u002Fdiv>\n  <div class=\"gbody\" style=\"position:relative;\">\n    <div style=\"position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);\">\n      <div class=\"node\" style=\"width:32mm;height:32mm;font-family:var(--sans);font-weight:600;font-size:30pt;\">04<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:auto;\">\n      <div class=\"kk\" style=\"font-family:var(--mono);font-size:8pt;letter-spacing:.16em;text-transform:uppercase;color:#7e858c;margin:0 0 3mm;\">Chapter 04<\u002Fdiv>\n      <h2 style=\"font-family:var(--sans);font-weight:600;font-size:30pt;letter-spacing:-.02em;margin:0;color:#f7f9f5;\">AI Results &amp; Measurements<\u002Fh2>\n      <p class=\"gp\" style=\"margin-top:5mm;max-width:120mm;\">Reading AI findings, urgency indicators, quantitative measurements and on-image overlays.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"gfoot\"><span>Chapter 04<\u002Fspan><span>aisap.ai<\u002Fspan><\u002Fdiv
